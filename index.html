<!doctype html>
<!--
  translate="no" (y el meta "google" a juego): el juego tiene su propio
  sistema de i18n (ES/EN) y depende de que los términos game.* (Agree,
  Disagree, Next…) se vean IDÉNTICOS en ambos idiomas (GDD §11) — la
  traducción automática del navegador/SO (Safari en iOS, Chrome/Google
  Translate) no lo sabe y los traduce igualmente si no se le dice que no
  toque la página (bug real reportado por Sofía en un iPhone 16).
-->
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/png" href="/src/assets/images/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accept All Cookies</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
